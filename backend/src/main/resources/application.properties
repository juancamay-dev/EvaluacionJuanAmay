quarkus.application.name=evaluacion-transferencias

quarkus.datasource.db-kind=mysql
# test: Dev Services crea un MySQL 8.4 desechable (no se define URL en %test)
quarkus.datasource.devservices.image-name=mysql:8.4
# dev: MySQL persistente del docker-compose (docker compose up -d mysql)
%dev.quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/transferencias_db
%dev.quarkus.datasource.username=app
%dev.quarkus.datasource.password=app123
# prod / Docker: variables de entorno
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:mysql://localhost:3306/transferencias_db}
%prod.quarkus.datasource.username=${DB_USER:app}
%prod.quarkus.datasource.password=${DB_PASSWORD:app123}

# El esquema lo gestiona Flyway
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.jdbc.timezone=UTC
quarkus.hibernate-orm.fetch.batch-size=16
%dev.quarkus.hibernate-orm.log.sql=true

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration,db/seed
%test.quarkus.flyway.locations=db/migration

quarkus.jackson.accept-case-insensitive-enums=true

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:4200}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization

quarkus.smallrye-openapi.info-title=API de Transferencias Interbancarias
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Cuentas, transferencias con reglas de negocio, detección de operaciones sospechosas e historial.
quarkus.swagger-ui.always-include=true

app.zona-horaria=America/Guayaquil
app.reglas.monto-sospechoso=5000.00
app.reglas.max-transferencias-por-hora=5
app.reglas.limite-diario=10000.00
