stages:
  - test

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

backend:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  # Quarkus Dev Services levanta MySQL 8.4 con Testcontainers sobre Docker-in-Docker
  services:
    - name: docker:27-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    TESTCONTAINERS_HOST_OVERRIDE: docker
    MAVEN_OPTS: -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository
  cache:
    key: maven
    paths:
      - .m2/repository
  script:
    - cd backend
    - ./mvnw -B verify
  artifacts:
    when: always
    paths:
      - backend/target/jacoco-report/
    reports:
      junit: backend/target/surefire-reports/TEST-*.xml

frontend:
  stage: test
  image: node:22
  variables:
    CHROME_BIN: /usr/bin/chromium
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm/
  before_script:
    - apt-get update -qq && apt-get install -y -qq chromium > /dev/null
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npm test -- --watch=false --browsers=ChromeHeadlessCI
    - npm run build
