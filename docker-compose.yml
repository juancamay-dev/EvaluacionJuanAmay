services:
  mysql:
    image: mysql:8.4
    container_name: evaluacion-mysql
    environment:
      MYSQL_DATABASE: transferencias_db
      MYSQL_USER: app
      MYSQL_PASSWORD: app123
      MYSQL_ROOT_PASSWORD: root123
      TZ: UTC
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: evaluacion-backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/transferencias_db
      DB_USER: app
      DB_PASSWORD: app123
      CORS_ORIGINS: http://localhost:4200
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure

  frontend:
    build: ./frontend
    container_name: evaluacion-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  mysql-data:
